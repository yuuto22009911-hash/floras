<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Floras Bloom — 遊び場</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #FAF7F2; --ink: #2C2825; --muted: #8A847C;
    --card: #FFFFFF; --border: rgba(44,40,37,0.10);
    --accent: #C44536; --accent-bg: rgba(196,69,54,0.08);
    --error-bg: #FFE5E5; --error-ink: #7A1F1F;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #15110D; --ink: #F4EFE6; --muted: #A39C90;
            --card: #1F1A14; --border: rgba(244,239,230,0.10);
            --accent: #FF8A7A; --accent-bg: rgba(255,138,122,0.10);
            --error-bg: #3A1717; --error-ink: #F4B7B7; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr; min-height: 100vh;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; font-weight: 600; }
  header .lead { color: var(--muted); font-size: 13px; }
  header .spacer { flex: 1; }
  header select, header button {
    font: inherit; padding: 6px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--ink);
    cursor: pointer;
  }
  header select { padding-right: 28px; }
  header button.primary {
    background: var(--accent); color: white; border-color: var(--accent);
  }
  header button:disabled { opacity: 0.5; cursor: not-allowed; }
  header .status {
    font-size: 12px; color: var(--muted);
    padding: 6px 10px; border-radius: 999px; background: var(--card);
    border: 1px solid var(--border);
  }
  header .status.live::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
    border-radius: 50%; background: #4CAF50; vertical-align: middle;
  }
  main {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 1px; background: var(--border);
    min-height: 0;
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  }
  .pane { background: var(--bg); display: flex; flex-direction: column; min-height: 0; }
  .pane h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 0; padding: 12px 18px;
    border-bottom: 1px solid var(--border);
  }
  .editor textarea {
    flex: 1; width: 100%; resize: none; padding: 18px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px; line-height: 1.6;
    background: transparent; color: var(--ink); border: 0; outline: 0;
    tab-size: 2;
  }
  .preview {
    overflow: auto; padding: 18px;
    background:
      repeating-linear-gradient(45deg, transparent 0 8px, rgba(44,40,37,0.025) 8px 9px);
  }
  .preview svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .error {
    background: var(--error-bg); color: var(--error-ink);
    padding: 14px 16px; border-radius: 8px; margin: 18px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    white-space: pre-wrap;
  }
  footer {
    grid-column: 1 / -1;
    padding: 8px 24px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 12px; display: flex; gap: 16px; flex-wrap: wrap;
  }
  footer a { color: inherit; text-decoration: underline; }
  kbd {
    background: var(--card); border: 1px solid var(--border);
    padding: 1px 6px; border-radius: 4px; font-size: 11px;
  }
</style>
</head>
<body>
<header>
  <h1>🌸 Floras Bloom — 遊び場</h1>
  <span class="lead">花を日本語で書いて SVG を生成</span>
  <span class="spacer"></span>
  <select id="sample" aria-label="サンプル選択"></select>
  <button id="render" class="primary" disabled>描画 <kbd>⌘↩</kbd></button>
  <button id="share">共有</button>
  <span id="status" class="status">起動中…</span>
</header>
<main>
  <section class="pane editor">
    <h2>ソース (.bloom)</h2>
    <textarea id="source" spellcheck="false"></textarea>
  </section>
  <section class="pane preview" id="preview-pane">
    <h2>プレビュー (SVG)</h2>
    <div id="preview"></div>
  </section>
</main>
<footer>
  <span>Pyodide 経由でブラウザだけで実行（バックエンド無し）</span>
  <span>•</span>
  <a href="https://github.com/yuuto22009911-hash/floras" target="_blank" rel="noopener">GitHub</a>
</footer>

<script type="module">
  // ---------- Inline samples (so the playground works as a single artefact) ----------
  const SAMPLES = {
    "さくら": `※ 5 弁桜 ─ 切れ込みのある花弁
色見本 春 {
  桜色 知覚色(0.85 0.10 12);
  墨   知覚色(0.20 0.02 30);
  紅   知覚色(0.55 0.18 25);
}

花 さくら {
  花弁数 5;
  大きさ 240;
  色 春.桜色;
  花弁反り 0.4;
  花弁切込 0.45;
  雄蕊数 14;
  雄蕊色 春.紅;
  輪郭 春.墨 幅 1.2;
}
`,
    "ばら": `※ ばら ─ 多弁を黄金角の螺旋で配置
花 ばら {
  花弁数 28;
  大きさ 260;
  色 知覚色(0.62 0.18 12);
  花弁反り 0.55;
  花弁切込 0;
  花弁幅 36;
  花弁丈 56;
  並び 螺旋;
  雄蕊数 0;
  輪郭 知覚色(0.30 0.10 25) 幅 1;
}
`,
    "こすもす": `※ こすもす ─ 8 弁、茎と葉つき
花 こすもす {
  花弁数 8;
  大きさ 220;
  色 知覚色(0.78 0.13 350);
  花弁反り 0.3;
  花弁切込 0.15;
  花弁幅 38;
  花弁丈 52;
  雄蕊数 18;
  雄蕊色 知覚色(0.60 0.13 75);
  茎 真;
  茎丈 200;
  茎色 知覚色(0.55 0.12 145);
  葉数 4;
}
`,
    "ヒーロー": `※ ヒーローセクション ─ さくらとゆりを 1200×630 のキャンバスに配置
色見本 春 {
  桜色 知覚色(0.85 0.10 12);
  紙   知覚色(0.97 0.01 80);
  墨   知覚色(0.22 0.02 30);
  紅   知覚色(0.55 0.18 25);
  挿   知覚色(0.65 0.14 60);
  本体 知覚色(0.85 0.07 80);
}

花 さくら {
  花弁数 5; 大きさ 280; 色 春.桜色;
  花弁反り 0.4; 花弁切込 0.45;
  雄蕊数 14; 雄蕊色 春.紅;
  輪郭 春.墨 幅 1.2;
}

花 ゆり {
  花弁数 6; 大きさ 240; 色 春.本体;
  花弁反り 0.5; 花弁切込 0;
  花弁幅 50; 花弁丈 110;
  雄蕊数 6; 雄蕊半径 8; 雄蕊色 春.挿;
  輪郭 春.墨 幅 1.2;
}

花束 ヒーロー {
  画布 1200 × 630;
  背景 春.紙;

  置く ゆり に (380, 320);
  置く さくら に (820, 320);
  置く さくら に (1080, 470) { 大きさ 140; 色 春.桜色 混ぜ 春.紙 0.4; };
  置く さくら に (160, 480)  { 大きさ 120; 色 春.桜色 混ぜ 春.紙 0.5; };
}
`,
    "桜吹雪": `※ 桜吹雪 ─ 散らす で 60 個のかべんを背景に散布
色見本 春 {
  桜色 知覚色(0.85 0.10 12);
  紙   知覚色(0.97 0.01 80);
  墨   知覚色(0.22 0.02 30);
}

花 かべん {
  花弁数 5; 大きさ 80; 色 春.桜色;
  花弁反り 0.4; 花弁切込 0.45;
  雄蕊数 0; 輪郭 春.墨 幅 0.6;
}

花 しゅやくざくら {
  花弁数 5; 大きさ 320; 色 春.桜色;
  花弁反り 0.4; 花弁切込 0.45;
  雄蕊数 14; 雄蕊色 春.墨;
  輪郭 春.墨 幅 1.2;
}

花束 ヒーロー {
  画布 1200 × 630;
  背景 春.紙;

  散らす {
    元 かべん;
    数 60;
    領域 画布;
    大きさ 16..56;
    回転 乱数;
    色 春.桜色 混ぜ 春.紙 0.4;
    種 42;
  }

  置く しゅやくざくら に 中央;
}
`,
    "枝 (模様)": `※ 枝 ─ 模様で「さくら と 蕾 ２つ」をひと枝として再利用
色見本 春 {
  桜色 知覚色(0.85 0.10 12);
  紙   知覚色(0.97 0.01 80);
  墨   知覚色(0.22 0.02 30);
  蕾色 知覚色(0.78 0.13 5);
}

花 さくら {
  花弁数 5; 大きさ 110; 色 春.桜色;
  花弁反り 0.4; 花弁切込 0.45;
  雄蕊数 10; 雄蕊色 春.墨;
  輪郭 春.墨 幅 0.8;
}

花 つぼみ {
  花弁数 5; 大きさ 50; 色 春.蕾色;
  花弁反り 0.6; 花弁切込 0.1;
  雄蕊数 0; 輪郭 春.墨 幅 0.5;
}

模様 ひとえだ {
  置く さくら   に (0, 0);
  置く つぼみ に (-50, -30);
  置く つぼみ に (45, 35);
}

花束 ヒーロー {
  画布 1200 × 630;
  背景 春.紙;

  散らす {
    元 ひとえだ;
    数 8;
    領域 矩形 (60, 80) へ (1140, 560);
    種 11;
  }

  置く さくら に 中央 { 大きさ 320; 雄蕊数 16; };
}
`,
  };

  const $ = (id) => document.getElementById(id);
  const $source = $('source');
  const $preview = $('preview');
  const $status = $('status');
  const $render = $('render');
  const $share = $('share');
  const $sample = $('sample');

  for (const name of Object.keys(SAMPLES)) {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    $sample.appendChild(opt);
  }

  function loadFromHash() {
    const m = location.hash.match(/^#code=([^&]+)/);
    if (!m) return false;
    try {
      const decoded = new TextDecoder().decode(
        Uint8Array.from(atob(m[1]), c => c.charCodeAt(0))
      );
      $source.value = decoded;
      return true;
    } catch { return false; }
  }

  if (!loadFromHash()) {
    $source.value = SAMPLES["さくら"];
  }

  $sample.addEventListener('change', () => {
    if ($sample.value && SAMPLES[$sample.value]) {
      $source.value = SAMPLES[$sample.value];
      // Auto-render after switching sample.
      runRender();
    }
  });

  // ---------- Pyodide bootstrap ----------
  let pyodide = null;
  let installed = false;

  async function bootPyodide() {
    $status.textContent = "Pyodide 読込中…";
    pyodide = await loadPyodide({
      indexURL: "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/",
    });
    $status.textContent = "Floras Bloom インストール中…";
    await pyodide.loadPackage("micropip");
    const wheelUrl = new URL("./floras-1.0.0-py3-none-any.whl", location.href).href;
    await pyodide.runPythonAsync(`
import micropip
await micropip.install("${wheelUrl}")
import floras
`);
    installed = true;
    $render.disabled = false;
    $status.textContent = "live";
    $status.classList.add("live");
  }

  async function runRender() {
    if (!installed) return;
    const source = $source.value;
    try {
      pyodide.globals.set("__src", source);
      const svg = await pyodide.runPythonAsync(`
import floras
floras.render(__src)
`);
      $preview.innerHTML = svg;
      $preview.classList.remove("show-error");
    } catch (err) {
      // Pyodide wraps Python errors with a long stack; keep just the last line.
      const msg = String(err).split("\\n").reverse().find(l => l.trim()) || String(err);
      $preview.innerHTML = `<pre class="error">${msg.replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</pre>`;
    }
  }

  $render.addEventListener('click', runRender);
  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); runRender(); }
  });

  $share.addEventListener('click', async () => {
    const enc = btoa(unescape(encodeURIComponent($source.value)));
    const url = `${location.origin}${location.pathname}#code=${enc}`;
    history.replaceState(null, '', `#code=${enc}`);
    try {
      await navigator.clipboard.writeText(url);
      $share.textContent = "コピー済";
      setTimeout(() => $share.textContent = "共有", 1200);
    } catch {
      // Fallback if clipboard API is unavailable.
      $share.textContent = url;
    }
  });

  // ---------- Bootstrap ----------
  const script = document.createElement('script');
  script.src = "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js";
  script.onload = () => bootPyodide().then(runRender).catch(err => {
    $status.textContent = "起動失敗";
    $preview.innerHTML = `<pre class="error">${String(err).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</pre>`;
  });
  document.head.appendChild(script);
</script>
</body>
</html>
