[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "floras"
version = "0.5.0"
description = "A flower-themed declarative DSL that emits SVG / HTML / CSS for designers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yuuto" }]
keywords = ["dsl", "svg", "design-tools", "floral", "generative", "design-system"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Markup",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
floras = "floras.cli:main"

[project.urls]
Homepage = "https://github.com/yuuto22009911/floras"
Issues = "https://github.com/yuuto22009911/floras/issues"

[tool.hatch.build.targets.wheel]
packages = ["floras"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["floras"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["floras", "tests"]
exclude = ["tests/fixtures/"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N806"]
"floras/ast_nodes.py" = ["E741"]  # OklchColor.l is the canonical CSS name
